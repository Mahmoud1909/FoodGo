name: Deploy to server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run remote deploy commands via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            echo "Deploying to ${DEPLOY_PATH}"
            cd "${{ secrets.DEPLOY_PATH }}" || exit 1
            # Backup current vendor (optional)
            if [ -d vendor ]; then mv vendor vendor.bak.$(date +%s) || true; fi
            composer install --no-dev --optimize-autoloader --no-interaction
            composer dump-autoload -o
            php artisan migrate --force || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            php artisan cache:clear || true
            sudo systemctl restart php8.2-fpm || sudo systemctl restart php8.1-fpm || true
            echo "Deploy finished"

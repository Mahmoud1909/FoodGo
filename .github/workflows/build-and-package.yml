name: Build and package

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, curl, json, openssl

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Ensure composer.lock contains new packages
        run: |
          set -e
          # Try updating only the missing package to avoid full dependency churn
          composer update google/cloud-firestore --no-dev --with-dependencies --optimize-autoloader --no-interaction || true
          # Fallback to install if update didn't produce vendor
          if [ ! -d vendor ] || [ ! -f vendor/autoload.php ]; then
            composer install --no-dev --optimize-autoloader --no-interaction
          fi

      - name: Commit composer.lock back to repo if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock || true
          if ! git diff --staged --quiet --exit-code; then
            git commit -m "chore(ci): update composer.lock (auto)"
            git push origin HEAD:main
          else
            echo "composer.lock unchanged"
          fi

      - name: Laravel optimize
        run: |
          php artisan config:cache || true
          php artisan route:cache || true
          php artisan view:cache || true

      - name: Prepare build folder
        run: |
          rm -rf build || true
          mkdir build
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='node_modules' ./ build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-build
          path: build

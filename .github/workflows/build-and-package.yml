name: Build and package

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, curl, json, openssl

      - name: Install grpc & protobuf (PECL) for PHP
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y php8.2-dev php-pear build-essential autoconf pkg-config libgrpc-dev || true
          # Install grpc and protobuf via pecl
          printf "\n" | sudo pecl install grpc || true
          printf "\n" | sudo pecl install protobuf || true
          # Enable extensions for CLI and FPM if paths exist
          if [ -d "/etc/php/8.2/cli/conf.d" ]; then echo "extension=grpc.so" | sudo tee /etc/php/8.2/cli/conf.d/20-grpc.ini; echo "extension=protobuf.so" | sudo tee /etc/php/8.2/cli/conf.d/20-protobuf.ini; fi
          if [ -d "/etc/php/8.2/fpm/conf.d" ]; then echo "extension=grpc.so" | sudo tee /etc/php/8.2/fpm/conf.d/20-grpc.ini; echo "extension=protobuf.so" | sudo tee /etc/php/8.2/fpm/conf.d/20-protobuf.ini; fi
          php -m | grep -E 'grpc|protobuf' || true

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Ensure composer.lock contains new packages
        run: |
          set -e
          # Update the Firestore package and allow updating root deps if required
          composer update google/cloud-firestore -W --no-dev --optimize-autoloader --no-interaction || true
          # Fallback to install if vendor not present
          if [ ! -d vendor ] || [ ! -f vendor/autoload.php ]; then
            composer install --no-dev --optimize-autoloader --no-interaction
          fi

      - name: Commit composer.lock back to repo if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock || true
          if ! git diff --staged --quiet --exit-code; then
            git commit -m "chore(ci): update composer.lock (auto)"
            git push origin HEAD:main
          else
            echo "composer.lock unchanged"
          fi

      - name: Laravel optimize
        run: |
          php artisan config:cache || true
          php artisan route:cache || true
          php artisan view:cache || true

      - name: Prepare build folder
        run: |
          rm -rf build || true
          mkdir build
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='node_modules' ./ build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-build
          path: build
